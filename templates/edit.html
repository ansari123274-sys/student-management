<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Edit Student</h2>

        <form action="/edit/{{ student.id }}" method="POST">

            <label>Student Name</label>

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >

            <label>Age</label>

            <input
                type="number"
                name="age"
                value="{{ student.age }}"
                required
            >

            <label>Course</label>

            <input
                type="text"
                name="course"
                value="{{ student.course }}"
                required
            >

            <label>Roll Number</label>

            <input
                type="text"
                name="roll_no"
                value="{{ student.roll_no }}"
                required
            >

            <button type="submit">
                Update Student
            </button>

        </form>

    </div>

</div>

</body>
</html>
