<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Student Management</h1>

        <p>Admin Login</p>

        <form action="/login" method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            {% if error %}

                <p class="login-error">
                    {{ error }}
                </p>

            {% endif %}

            <button
                type="submit"
                class="primary-btn login-btn"
            >
                Login
            </button>

        </form>

    </div>

</div>

</body>

</html>
